# Linux

*January 2026*

---

## Introduction About Linux

**Linux** = Family of open source Unix-like operating systems built around the Linux kernel (a kernel first released in 1991 by Linus Torvalds).

For more information, see https://kernel.org.

**Linux distribution** = Operating system that includes the Linux kernel.

For more information, see https://en.wikipedia.org/wiki/List_of_Linux_distributions.

---

## Linux Distributions

Thousands of Linux distributions exist (many based on other distributions).

Each Linux distribution has a particular aim and philosophy. The main elements that differ between Linux distributions are:

* User-friendliness (ease of implementation)
* Integration (size of the validated software portfolio)
* Notoriety (community for solving problems)
* Package management and number of packages available
* Update frequency, in particular how quickly security upgrades are available
* Maintainer (usually a company or community)

For more information, see https://en.wikipedia.org/wiki/Comparison_of_Linux_distributions.

MCC Interim Linux is possibly the first Linux distribution. It was created by the Manchester Computing Centre in 1992.

---

### Alpine Linux

* Created and maintained by Alpine Linux Development Team
* Initial release in 2005
* Simple, small size / lightweight and rapid startup
* Used in containers (e.g. with Docker)
* Default package management tool: APK
* For more information, see https://alpinelinux.org.

---

### Arch Linux

* Created by Judd Vinet
* Initial release in 2002
* Maintained by a development team
* Intentionally minimal, as it is meant to be configured by the user during installation
* The basis of other distributions (e.g. SteamOS)
* Default package management tool: Pacman
* Mainly GNU General Public License and other free software licenses
* For more information, see https://archlinux.org.

---

### Debian

* Second-oldest Linux distribution still in active development
* Created by Ian Murdock
* Initial release in 1993
* Maintained by the Debian Project
* The basis of many other Linux distributions (e.g. Ubuntu)
* Default package management tool: APT
* License: DFSG-compatible licenses and proprietary firmware files
* For more information, see https://www.debian.org.

The name "Debian" comes from the names "Deb" and "Ian". Debian was founded by Ian Murdock. Debra Lynn is the name of his then-girlfriend.

---

### Fedora Linux

* Created and maintained by the Fedora Project
* Initial release in 2003
* It was originally developed as a continuation of the Red Hat Linux project.
* Aim: on the leading edge of open source technologies
* The upstream source for CentOS Stream and Red Hat Enterprise Linux
* Default package management tools: DNF, yum, PackageKit
* GNU General Public License, various free software licenses and proprietary firmware files
* For more information, see https://fedoraproject.org.

---

### Linux Mint

* Created by Clement Lefebvre
* Initial release in 2006
* Maintained by a development team
* It is based on Ubuntu.
* Default package management tool: APT
* GNU General Public License, other free software licenses and minor additions of proprietary software
* For more information, see http://linuxmint.com.

---

### Red Hat Entreprise Linux (RHEL)

* Commercial Linux distribution
* Created and maintained by Red Hat
* Initial release in 2000
* The basis for several third-party derivatives (e.g. Oracle Linux)
* Default package management tool: RPM, yum
* Various free software licenses and proprietary binary blobs
* For more information, see https://redhat.com/rhel.

---

### Slackware

* Oldest Linux distribution that is still maintained
* Created by Patrick Volkerding
* Initial release in 1993
* Maintained by a development team
* The basis for many other Linux distributions
* Aims: design stability, simplicity and to be the most "Unix-like" Linux distribution
* Default package management tool: slackpkg
* GNU General Public License
* For more information, see http://www.slackware.com.

---

### Ubuntu

* Created and maintained by the company Canonical
* Initial release in 2004
* It is based on Debian.
* One of the most popular Linux distributions for general desktop use.
* Default package management tool: APT
* License: Free software and some proprietary device drivers
* For more information, see https://ubuntu.com.

The name "Ubuntu" comes from the Nguni philosophy of ubuntu ("humanity to others" or "I am what I am because of who we all are").
